local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 描述, widget: text }
      - { name: pubDate, label: 发布日期, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: updatedDate, label: 更新日期, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { name: category, label: 分类, widget: select, options: ["前端", "设计系统", "工程化", "随笔", "开源"] }
      - { name: tags, label: 标签, widget: list, default: [] }
      - { name: draft, label: 草稿, widget: boolean, default: false, required: false }
      - { name: coverImage, label: 封面图, widget: image, required: false }
      - { name: body, label: 正文, widget: markdown }